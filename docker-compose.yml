# Deploy su VPS (o macchina locale): app + Caddy come reverse proxy con HTTPS.
# 1) copia deploy.env.example in .env e riempilo   2) docker compose up -d --build
#
# Caddy ottiene il certificato TLS automaticamente se SITE_ADDRESS è un dominio
# (es. demo.miosito.it). Per una prova senza dominio lascia SITE_ADDRESS=:80
# e usa http://IP-del-server.

# Nome progetto esplicito: senza questo entrambi i compose di questa cartella
# ricadrebbero sullo stesso progetto (il nome della directory) e si vedrebbero a
# vicenda come "orphan containers" — con `down --remove-orphans` uno cancella l'altro.
name: workflower

services:
  app:
    build: .
    environment:
      DATA_DIR: /data/repo
      JWT_SECRET: ${JWT_SECRET:?serve un JWT_SECRET}
      LLM_T1_MODEL: ${LLM_T1_MODEL:?serve LLM_T1_MODEL}
      LLM_T2_MODEL: ${LLM_T2_MODEL:?serve LLM_T2_MODEL}
      LLM_T3_MODEL: ${LLM_T3_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DIAGNOSTICA_AUTO: ${DIAGNOSTICA_AUTO:-0}
      # Integrazione ERP (opzionale): se le tre obbligatorie non sono tutte
      # valorizzate la sincronizzazione è spenta e l'app funziona come prima.
      # Attenzione: dentro al container "localhost" è il container stesso — per un
      # ERPNext sullo stesso host usa host.docker.internal o l'IP raggiungibile.
      ERP_BASE_URL: ${ERP_BASE_URL:-}
      ERP_API_KEY: ${ERP_API_KEY:-}
      ERP_API_SECRET: ${ERP_API_SECRET:-}
      ERP_COMPANY: ${ERP_COMPANY:-}
      ERP_CONTO_RITENUTA: ${ERP_CONTO_RITENUTA:-}
      ERP_CONTO_IVA: ${ERP_CONTO_IVA:-}
      ERP_CONTO_COSTO: ${ERP_CONTO_COSTO:-}
      ERP_PARENT_COST_CENTER: ${ERP_PARENT_COST_CENTER:-}
      ERP_ITEM_DDT: ${ERP_ITEM_DDT:-}
      ERP_SUPPLIER_GROUP: ${ERP_SUPPLIER_GROUP:-}
      # Parser documenti (opzionale): se DOCLING_URL è vuota il tool
      # `leggi_documento` non viene registrato e tutto funziona come prima —
      # l'LLM legge le pagine come immagini.
      #
      # La sintassi `${VAR:+valore}` significa «se DOCLING_URL è valorizzata usa
      # http://docling:5001, altrimenti niente». Serve perché lo **stesso**
      # indirizzo non può valere da tutte e due le parti: in .env sta il valore
      # per lo sviluppo (backend sull'host → 127.0.0.1:5001), ma dentro al
      # container 127.0.0.1 è il container stesso, e il sidecar si raggiunge
      # per nome di servizio. Senza questa riga l'app in compose accetterebbe i
      # Word e poi fallirebbe la conversione: peggio di averla spenta.
      DOCLING_URL: ${DOCLING_URL:+http://docling:5001}
      DOCLING_TIMEOUT: ${DOCLING_TIMEOUT:-}
      DOCLING_MAX_CARATTERI: ${DOCLING_MAX_CARATTERI:-}
    volumes:
      - workflower-data:/data
    expose:
      - "8000"
    restart: unless-stopped

  # Parser documenti su GPU (opzionale). Si avvia solo chiedendolo:
  #     docker compose --profile docling up -d
  # e in .env: DOCLING_URL=http://docling:5001
  #
  # Senza questo servizio Workflower funziona esattamente come prima. Con questo,
  # i PDF nati al computer, i Word e gli Excel vengono letti come testo con le
  # tabelle ricostruite, invece che come immagini.
  #
  # ATTENZIONE all'immagine: la variante `-cu130` porta kernel CUDA fino a sm_120.
  # Va bene per RTX 3080/4090; sul **DGX Spark (GB10, sm_121) NON parte sulla GPU**
  # e serve un'immagine ricostruita su base NGC pytorch (vedi analisi-docling.md).
  # Verificare sempre prima: docker manifest inspect <immagine> | grep arm64
  docling:
    profiles: [docling]
    image: ${DOCLING_IMAGE:-quay.io/docling-project/docling-serve-cu130:v1.29.0}
    environment:
      DOCLING_DEVICE: cuda
      # L'endpoint sincrono interroga la coda interna a questo intervallo: col
      # default (2) si pagano 2 secondi anche per una conversione da 130 ms.
      # È un intero: un valore decimale fa fallire l'avvio del container.
      DOCLING_SERVE_SYNC_POLL_INTERVAL: "1"
    volumes:
      # I pesi dei modelli sono già dentro l'immagine (nessun download a runtime):
      # il volume serve solo a non riscaricarli se un domani cambiasse.
      - docling-models:/opt/app-root/src/.cache
    expose:
      - "5001"
    ports:
      # Pubblicato **solo su loopback**: serve allo sviluppo, dove il backend gira
      # sull'host (`make dev`) e non dentro al compose — con DOCLING_URL puntata a
      # http://127.0.0.1:5001. In rete non è esposto: l'app in compose lo raggiunge
      # comunque per nome di servizio, senza passare da qui.
      - "127.0.0.1:5001:5001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  workflower-data:
  docling-models:
  caddy-data:
  caddy-config:
