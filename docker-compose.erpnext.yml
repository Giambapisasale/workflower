# ERPNext come dipendenza ESTERNA di Workflower (system-of-record contabile a valle).
#
# Ambiente di sviluppo/PoC "tutto-in-uno": ricalca il file ufficiale `pwd.yml` di
# frappe_docker (https://github.com/frappe/frappe_docker), che è la fonte di verità.
# In produzione seguire la guida ufficiale di frappe_docker.
#
# ── Avvio ──────────────────────────────────────────────────────────────────────
#   docker compose -f docker-compose.erpnext.yml up -d
#   # la prima volta scarica le immagini e CREA il sito (servizio create-site):
#   docker compose -f docker-compose.erpnext.yml logs -f create-site   # attendi "current"
#   # poi apri http://localhost:8080/app  →  utente: Administrator   password: admin
#   # (la SCRIVANIA è /app; la radice / è il portale fornitori e nega i documenti: 403)
#
# ── Stop / reset ───────────────────────────────────────────────────────────────
#   docker compose -f docker-compose.erpnext.yml down          # ferma (mantiene i dati)
#   docker compose -f docker-compose.erpnext.yml down -v       # AZZERA tutto (volumi inclusi)
#
# Workflower NON dipende da questo compose: lo raggiunge via HTTP con le env
# ERP_BASE_URL / ERP_API_KEY / ERP_API_SECRET (vedi docs/erp-poc.md § "Collega").
# Pinna la versione con:  ERPNEXT_VERSION=v15 docker compose -f docker-compose.erpnext.yml up -d

# Progetto separato da quello dell'app (vedi la nota in docker-compose.yml): i due
# stack vivono nella stessa cartella ma non devono interferire.
name: workflower-erpnext

x-customizable-image: &customizable_image
  image: frappe/erpnext:${ERPNEXT_VERSION:-v15}
  pull_policy: always
  restart: on-failure

x-depends-on-configurator: &depends_on_configurator
  depends_on:
    configurator:
      condition: service_completed_successfully

# I servizi che *servono* il sito devono attendere che il sito ESISTA: se partono
# in parallelo a create-site mettono in cache un elenco app vuoto e ogni chiamata
# REST risponde "App erpnext is not installed" finché non si svuota la cache.
x-depends-on-site: &depends_on_site
  depends_on:
    create-site:
      condition: service_completed_successfully

x-backend-defaults: &backend_defaults
  <<: [*customizable_image, *depends_on_site]
  volumes:
    - sites:/home/frappe/frappe-bench/sites

services:
  # Scrive common_site_config.json (host db/redis) e poi esce: precondizione di tutti.
  configurator:
    <<: *backend_defaults
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"

  # Crea il sito "frontend" e installa ERPNext (una volta sola). Admin password: admin.
  create-site:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v15}
    pull_policy: always
    restart: "no"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      configurator:
        condition: service_completed_successfully
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        if [ -f sites/frontend/site_config.json ]; then
          echo "sito 'frontend' già presente: niente da creare";
          exit 0;
        fi;
        bench new-site --mariadb-user-host-login-scope='%' \
          --admin-password=admin \
          --db-root-username=root --db-root-password=admin \
          --install-app erpnext --set-default frontend;

  backend:
    <<: *backend_defaults

  frontend:
    <<: *customizable_image
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started
    ports:
      - "8080:8080"

  websocket:
    <<: [*customizable_image, *depends_on_site]
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites

  queue-short:
    <<: *backend_defaults
    command: ["bench", "worker", "--queue", "short,default"]

  queue-long:
    <<: *backend_defaults
    command: ["bench", "worker", "--queue", "long,default,short"]

  scheduler:
    <<: *backend_defaults
    command: ["bench", "schedule"]

  # db e redis hanno bisogno di una restart policy quanto i servizi frappe: se il
  # motore Docker si riavvia (o la macchina va in sospensione) i frappe tornano su
  # da soli e senza questa riga troverebbero il database spento — stack apparentemente
  # avviato ma inutilizzabile, con "Can't connect to MySQL server on 'db'" nei log.
  db:
    image: mariadb:10.6
    restart: unless-stopped
    healthcheck:
      test: mysqladmin ping -h localhost --password=admin
      interval: 1s
      retries: 20
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: admin
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-cache-data:/data

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

volumes:
  sites:
  db-data:
  redis-cache-data:
  redis-queue-data:
